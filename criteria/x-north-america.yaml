# X creators in North America. Load into the Criteria tab with:
#   python -m outreach criteria-import criteria/x-north-america.yaml --only
# (--only disables the other Criteria rows). Edit the sheet afterwards if you like;
# re-importing overwrites this row.
name: x-north-america
enabled: true
platforms: x
regions: US,CA
language: en
keywords: AI tools, SaaS, startups, ecommerce operations, creator economy
description: >-
  Real individual creators based in the US or Canada who post in English about AI tools,
  SaaS, startups, ecommerce operations or the creator economy, with an audience of people
  who use tools.
min_followers: 3000
max_followers: 30000
min_avg_likes: 0
max_candidates: 200
pitch: ""
rules: |
  一、硬性条件（全部满足才进名单）
  1. 受众在北美：博主本人在美国或加拿大，用英语发帖，评论区和互动的账号主要来自北美，发帖活跃时段在北美时区。
  2. 真人素人：头像是真人照片，不用 AI 生成头像，也不是卡通或 logo；个人语气，有自己的生活或工作内容。
  3. 话题对口：内容围绕 AI 工具、SaaS、创业、电商运营或创作者经济，粉丝是会用工具的人。
  4. 体量：3k 到 30k 粉丝。
  5. 真实互动：一般帖子的浏览量约为粉丝数的 10% 以上，评论是真人在说话。
  6. 活跃：账号至少半年，近 7 天内有发帖。
  7. 可联系：私信开着，或简介里有联系方式。

  二、排除条件（任何一条就不要）
  - 广告号：置顶或近期帖子里推广占比高，每隔几条就是广告。
  - 带着 AI 头像，或者内容明显由 AI 批量生成。
  - 评论区全是 "Great post" 一类的泛泛互动，粉丝数突然暴涨。
  - 做空投、抽奖、互关的账号。
  - 受众主要不在北美。

  三、分档（icp_fit）
  - High：全部满足，并且以前有工具推荐，评论区有人问链接或价格。
  - Medium：全部满足，但没有带货证据。
  - Low：勉强，不联系。
