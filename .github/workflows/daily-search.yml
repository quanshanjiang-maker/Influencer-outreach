name: Daily creator search

on:
  workflow_dispatch: {}
  # Uncomment after your secrets are set. Runs 13:00 UTC daily.
  # 配好 Secrets 后取消注释。每天 UTC 13:00 运行。
  # schedule:
  #   - cron: "0 13 * * *"

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EASYKOL_API_KEY: ${{ secrets.EASYKOL_API_KEY }}
          EASYKOL_API_EMAIL: ${{ secrets.EASYKOL_API_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m outreach search -v
