name: Run a command

# One-click runner for any step, from the Actions tab: "Run workflow" -> pick a command.
# 在 Actions 页点 "Run workflow" 选一个命令就能运行，不用装 Python。
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: true
        type: choice
        options:
          - setup-sheet
          - search --dry-run
          - search
          - score --dry-run
          - score
          - emails --dry-run
          - emails
          - criteria-import criteria/x-north-america.yaml --only
          - criteria-import criteria/x-competitors.yaml --only
          - criteria-import criteria/x-ecommerce.yaml
          - criteria-import criteria/x-ai-news.yaml
          - criteria-import criteria/x-ai-video-artists.yaml
          - template-import templates/frevana-default.yaml
          - template-import templates/frevana-interview.yaml
          - criteria-import criteria/x-cross-platform.yaml
          - criteria-import criteria/tk-affiliate.yaml
          - criteria-import criteria/ig-affiliate.yaml
          - sort-candidates
          - find-candidates
          - list-candidates
          - x-profiles
          - set-fields
          - archive-candidates --platform youtube --dry-run
          - archive-candidates --platform youtube
          - approve --dry-run
          - approve
          - test-email
          - send --dry-run
          - send
          - replies --dry-run
          - replies
          - dump-replies
          - dump-shortlist
          - socials
          - counter-offer
          - dump-threads
          - slack digest --dry-run
      extra:
        description: "Extra flags, e.g. --limit 20, or for approve: --min-score 8 --skip youtube:foo (optional)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a send batch of 15 with 1-2 min gaps takes up to ~30 min
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      EASYKOL_API_KEY: ${{ secrets.EASYKOL_API_KEY }}
      EASYKOL_API_EMAIL: ${{ secrets.EASYKOL_API_EMAIL }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      MILLIONVERIFIER_API_KEY: ${{ secrets.MILLIONVERIFIER_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      COMPANY_MAIL_PASSWORD: ${{ secrets.COMPANY_MAIL_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      CMD: ${{ inputs.command }}
      EXTRA: ${{ inputs.extra }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        # Flags are split on spaces; only letters, digits and - _ , . : @ are allowed.
        run: |
          case "$EXTRA" in *[!A-Za-z0-9\ _.,:@-]*) echo "extra contains unsupported characters"; exit 1;; esac
          python -m outreach -v $CMD $EXTRA
