name: Send approved emails and check replies

# Sends only rows you already approved (status approved / followup_approved).
# 只发送你已经批准的行。
on:
  workflow_dispatch: {}
  # Uncomment after mailboxes and secrets are set. Hourly, 14:00-23:00 UTC.
  # 配好邮箱和 Secrets 后取消注释。
  # schedule:
  #   - cron: "0 14-23 * * 1-5"

concurrency: send-and-replies

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      # Names must match the *_env fields under mailboxes: in config.yaml
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      COMPANY_MAIL_PASSWORD: ${{ secrets.COMPANY_MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send
        run: python -m outreach send -v
      - name: Check replies
        run: python -m outreach replies -v
