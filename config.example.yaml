# Copy to config.yaml and edit. 复制为 config.yaml 再修改。
# Search criteria live in the "Criteria" sheet tab so you can change them daily
# without touching code. 搜索标准写在表格的 Criteria 页，每天可改。

models:
  # Writes X search queries from your keywords. 把关键词扩展成 X 搜索语句。
  query_expansion: claude-opus-5-5
  # Scores each creator and drafts the email opener. 打分并写开场白。
  scoring: claude-haiku-5-5
  # Understands your Slack messages. 理解你在 Slack 里说的话。
  chat: claude-haiku-5-5

# Platforms are chosen per row in the Criteria tab (column "platforms"):
#   x          -> TwitterAPI.io        (TWITTERAPI_IO_KEY)
#   youtube    -> YouTube Data API v3  (YOUTUBE_API_KEY, free daily quota)
#   instagram  -> Apify Instagram Scraper (APIFY_TOKEN)
#   tiktok     -> Apify TikTok Scraper    (APIFY_TOKEN)
# 平台在 Criteria 页的 platforms 列按行选择，例如 x,youtube,instagram,tiktok

# Which provider serves each platform. 每个平台用哪个数据源。
#   youtube:   youtube_api (free) | easykol
#   instagram: apify | easykol
#   tiktok:    apify | easykol
# EasyKOL (EASYKOL_API_KEY + EASYKOL_API_EMAIL) does semantic search itself and
# returns creators with emails; billed per batch of results on your EasyKOL plan.
# EasyKOL 自带语义搜索并返回邮箱，按批次扣你 EasyKOL 套餐里的任务点数。
providers:
  x: twitterapi_io
  youtube: youtube_api
  instagram: apify
  tiktok: apify
  easykol_options:
    batch_count: 1          # 1-10 batches per search; Instagram costs 2 points per batch
    has_contact_info: true  # only creators EasyKOL has an email for

search:
  queries_per_criteria: 12     # search queries Claude writes per criteria row and platform
  pages_per_query: 3           # ~20 results per page (50 on YouTube)
  # Hard stop on results fetched per run, per platform (cost control). 每次运行每个平台最多抓取的结果数。
  daily_result_budget:
    x: 20000
    youtube: 5000
    instagram: 3000
    tiktok: 3000

scoring:
  min_score: 7              # 0-10; below this a candidate is marked rejected
  max_per_run: 1000
  workers: 8                # parallel Claude calls
  fetch_recent_posts: true  # X only: pull the last 20 tweets (~$0.003 per creator)

sheet_tabs:
  criteria: Criteria
  candidates: Candidates
  outreach: Outreach
  templates: Templates

# Sending mailboxes. Emails rotate across them (round-robin) within each daily_limit.
# Secrets are NOT written here: each *_env names an environment variable / GitHub Secret.
# 发信邮箱（轮流发送 round-robin）。密钥不写在这里，*_env 填环境变量名。
mailboxes:
  - name: personal
    type: gmail                     # Gmail API (personal Gmail or Google Workspace)
    address_env: GMAIL_ADDRESS      # read from a secret so the address isn't in this public file
    from_name_env: SENDER_NAME      # 发件人地址和名字从 Secrets 读取（也可以直接写 address: / from_name:）
    daily_limit: 30                 # keep new mailboxes low and warm up slowly 新邮箱先少发（预热 warm-up）
    client_id_env: GOOGLE_CLIENT_ID
    client_secret_env: GOOGLE_CLIENT_SECRET
    refresh_token_env: GOOGLE_REFRESH_TOKEN
  # Company mailbox on any provider (Microsoft 365, Tencent Exmail, Zoho ...): SMTP + IMAP.
  # 企业邮箱，任何服务商都可以用 SMTP + IMAP 连接。
  # - name: company
  #   type: smtp
  #   address: you@yourcompany.com
  #   from_name: Your Name
  #   daily_limit: 40
  #   smtp_host: smtp.office365.com
  #   smtp_port: 587                # 465 = SSL, anything else = STARTTLS
  #   imap_host: outlook.office365.com
  #   imap_port: 993
  #   password_env: COMPANY_MAIL_PASSWORD   # app password 应用专用密码

sending:
  max_per_run: 50
  min_delay_seconds: 60       # random pause between emails 每封之间随机等待
  max_delay_seconds: 180
  followup_after_days: 4      # mark followup_due if no reply after N days
  max_followups: 1
