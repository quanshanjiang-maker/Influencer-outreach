# Micro TK/IG creators (<3k): creator-network interview, 20-min video call, $50 gift card (2026-11-27, pending user OK).
name: network
subject: "Frevana x {name}: you're on our creator shortlist ✨"
body: |
  Hi {name},

  This is Amy from Frevana. We've been loving your product finds! Your content feels genuine, and that's exactly what brands are looking for.

  We're building a curated network of standout creators, and we work with a growing number of e-commerce shops that are actively looking for creators like you to partner with.

  To get to know you better, we'd love to have a relaxed 20-minute video call about your content, your audience and the kind of brands you enjoy working with. As a thank-you for your time, we'll send you a $50 Frevana gift card.

  Just grab whatever time works best for you here: https://calendly.com/amy-frevana/30min

  Thank you so much, and we can't wait to meet you!

  Amy
  Frevana | https://www.frevana.com
